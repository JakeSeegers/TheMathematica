<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luminati · Core sandbox</title>
  <style>
    :root {
      --gold: #c9a45c;
      --gold-dim: rgba(201, 164, 92, 0.45);
      --ink: #efe6d2;
      --ink-dim: #b9ad95;
      --panel: linear-gradient(180deg, rgba(18, 22, 40, 0.86), rgba(6, 7, 14, 0.9));
    }
    html, body { margin: 0; height: 100%; background: #07080f; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(10, 6, 18, 0.55) 100%); }
    .panel {
      position: fixed; z-index: 10; color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--gold-dim);
      outline: 1px solid rgba(201, 164, 92, 0.18); outline-offset: 3px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
      border-radius: 3px;
      font: 13px/1.35 'Crimson Pro', Georgia, serif;
    }
    .panel h2 {
      margin: 0 0 6px; font: 600 12px/1 'Cinzel', Georgia, serif; letter-spacing: 0.14em;
      color: var(--gold); text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .panel h2::before, .panel h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); }
    #info { left: 14px; top: 14px; width: 360px; padding: 12px 14px; pointer-events: none; }
    #info .title { font: 600 17px/1.1 'Cinzel', Georgia, serif; letter-spacing: 0.08em; color: #f3e2b5; margin-bottom: 2px; }
    #info .sub { color: var(--ink-dim); font-style: italic; margin-bottom: 10px; }
    #readout { font: 13px/1.45 'Pixelify Sans', ui-monospace, monospace; white-space: pre; color: #e8dcc0; }
    #readout b { color: var(--gold); font-weight: 400; }
    #controls { right: 14px; top: 14px; width: 292px; padding: 12px 14px; max-height: calc(100% - 56px); overflow: auto; }
    #controls section { margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .grid.two { grid-template-columns: repeat(2, 1fr); }
    button {
      font: 13px/1 'Crimson Pro', Georgia, serif; color: var(--ink);
      background: linear-gradient(180deg, rgba(60, 52, 38, 0.65), rgba(24, 20, 16, 0.75));
      border: 1px solid var(--gold-dim); border-radius: 2px; padding: 6px 4px; cursor: pointer;
    }
    button:hover { border-color: var(--gold); color: #fff3d0; }
    button.on { background: linear-gradient(180deg, rgba(150, 118, 58, 0.8), rgba(80, 60, 28, 0.85)); color: #fff6dc; }
    button.wide { width: 100%; padding: 8px 4px; font-size: 14px; }
    label.row { display: grid; grid-template-columns: 64px 1fr 34px; align-items: center; gap: 6px; margin: 3px 0; color: var(--ink-dim); }
    label.row span:last-child { font: 11px 'Pixelify Sans', monospace; color: var(--ink); text-align: right; }
    input[type=range] { width: 100%; accent-color: var(--gold); }
    label.check { display: flex; gap: 6px; align-items: center; color: var(--ink-dim); margin: 3px 0; }
    #hint {
      left: 50%; bottom: 14px; transform: translateX(-50%); padding: 7px 18px; pointer-events: none;
      font-size: 14px; color: var(--ink-dim); white-space: nowrap;
    }
    #hint kbd { font: 11px 'Pixelify Sans', monospace; color: #f3e2b5; border: 1px solid var(--gold-dim); border-radius: 2px; padding: 1px 4px; margin: 0 2px; }
    #scope { display: block; width: 100%; height: 64px; margin-top: 6px; background: rgba(0,0,0,0.35); border: 1px solid rgba(201,164,92,0.25); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="info" class="panel">
    <div class="title">Luminati · Core</div>
    <div class="sub">Engine loop · Input · Camera rig · Audio</div>
    <div id="readout"></div>
  </div>
  <div id="controls" class="panel" data-input-ignore></div>
  <div id="hint" class="panel">
    <kbd>WASD</kbd> move <kbd>Shift</kbd> run <kbd>Q</kbd><kbd>E</kbd> rotate <kbd>Wheel</kbd><kbd>Z</kbd><kbd>X</kbd> zoom
    <kbd>Space</kbd> confirm <kbd>Esc</kbd> cancel <kbd>M</kbd> music
  </div>
  <script type="module" src="./core.js"></script>
</body>
</html>
