<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Luminati · Editor 3D viewport sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; background: #0d1018; overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  #hud { position: fixed; left: 10px; bottom: 8px; font: 12px ui-monospace, monospace; color: #c9ceda;
    text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; z-index: 5; }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="hud"></div>
<script type="module" src="./editor3d.js"></script>
</body>
</html>
