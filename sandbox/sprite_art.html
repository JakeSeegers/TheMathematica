<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Luminati — Sprite Art Gallery</title>
<style>
  :root {
    --bg: #5d6b66;
    --bg2: #4f5c58;
    --card: #66756f;
    --ink: #f2ecdc;
    --ink-dim: #cfc6b0;
    --gold: #c9a45c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 Georgia, 'Times New Roman', serif; }
  body { padding: 14px 18px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0.06em; color: var(--gold); font-weight: normal; }
  h2 { font-size: 15px; margin: 18px 0 8px; color: var(--gold); font-weight: normal; letter-spacing: 0.08em; border-bottom: 1px solid rgba(201,164,92,0.4); padding-bottom: 3px; }
  .sub { color: var(--ink-dim); margin: 0 0 8px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { background: var(--card); border: 1px solid rgba(0,0,0,0.25); border-radius: 4px; padding: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .card .label { font-size: 13px; margin-bottom: 5px; color: var(--ink); letter-spacing: 0.04em; }
  .card .label small { color: var(--ink-dim); }
  .row { display: flex; gap: 6px; align-items: flex-end; margin-top: 6px; }
  .prev { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .prev span { font-size: 10px; color: var(--ink-dim); }
  .sheet { background: repeating-conic-gradient(#6a7a73 0% 25%, #627069 0% 50%) 0 0 / 16px 16px; }
  .props .card { display: flex; flex-direction: column; align-items: center; min-width: 90px; }
  #three { width: 100%; height: 520px; display: block; border-radius: 4px; overflow: hidden; background: #22282b; }
  .focus .card { padding: 10px; }
</style>
</head>
<body>
<h1>Luminati · Sprite Art</h1>
<p class="sub">Procedural characters, creatures and prop sprites (CharacterSprites.js / PropSprites.js). Sheets: columns idle0 idle1 walk0-3 · rows down left right up.</p>
<div id="app"></div>
<script type="module" src="./sprite_art.js"></script>
</body>
</html>
