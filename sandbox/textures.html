<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Luminati · Texture Library sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; background: #0e1016; color: #e8e2d0; font: 13px/1.35 system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; }
  #gl canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #labels div { position: absolute; transform: translate(-50%, -100%); padding: 1px 6px; border-radius: 3px;
    background: rgba(8, 10, 16, 0.72); color: #f0e6c8; font: 600 11px/1.4 ui-monospace, monospace; white-space: nowrap; }
  #atlas { position: absolute; inset: 0; padding: 14px 16px 40px; display: none; background: #14161d; min-height: 100%; box-sizing: border-box; }
  #atlas.on { display: block; }
  #atlas h2 { margin: 10px 0 8px; font: 600 14px/1 ui-monospace, monospace; color: #c9a45c; letter-spacing: .08em; text-transform: uppercase; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .card { background: #1c1f28; border: 1px solid #2c303c; border-radius: 4px; padding: 6px; }
  .card canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .card .row { display: flex; gap: 6px; align-items: flex-start; }
  .card .aux canvas { margin-bottom: 4px; }
  .card .lbl { margin-top: 4px; font: 600 11px/1.3 ui-monospace, monospace; color: #e8dcb8; }
  .card .lbl span { color: #8a8f9e; font-weight: 400; }
  .checker { background-color: #3a3f4c; background-image: linear-gradient(45deg, #2a2e38 25%, transparent 25%, transparent 75%, #2a2e38 75%),
    linear-gradient(45deg, #2a2e38 25%, transparent 25%, transparent 75%, #2a2e38 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  #hud { position: fixed; left: 10px; bottom: 8px; font: 12px ui-monospace, monospace; color: #9aa0b0; pointer-events: none; }
</style>
</head>
<body>
<div id="gl"></div>
<div id="labels"></div>
<div id="atlas"></div>
<div id="hud"></div>
<script type="module" src="./textures.js"></script>
</body>
</html>
