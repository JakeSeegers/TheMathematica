<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PostFX Sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a10; overflow: hidden; }
    #app { position: fixed; inset: 0; overflow: hidden; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #label {
      position: fixed; left: 12px; bottom: 10px; z-index: 5;
      font: 12px/1.3 ui-monospace, Consolas, monospace; color: #e8d9b5; opacity: 0.85;
      text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="label"></div>
  <script type="module" src="./postfx.js"></script>
</body>
</html>
