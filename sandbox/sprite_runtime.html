<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Luminati sandbox — sprite runtime &amp; particles</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  .zone-label {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
    font: 600 13px/1.1 Georgia, 'Times New Roman', serif; letter-spacing: 0.08em; text-transform: uppercase;
    color: #f3e3bf; padding: 3px 8px 4px; white-space: nowrap; pointer-events: none;
    background: linear-gradient(180deg, rgba(18, 16, 28, 0.78), rgba(8, 8, 14, 0.78));
    border: 1px solid rgba(201, 164, 92, 0.75); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.45);
    border-radius: 2px;
  }
  #hud {
    position: fixed; left: 14px; top: 12px; pointer-events: none;
    font: 13px/1.35 Georgia, serif; color: #f1e4c6; text-shadow: 0 1px 2px #000;
    background: rgba(10, 10, 18, 0.55); border: 1px solid rgba(201, 164, 92, 0.6); padding: 8px 12px; border-radius: 3px;
  }
  #hud b { font-weight: 600; letter-spacing: 0.06em; color: #e9c77e; }
  #hud .dim { color: #b9ad95; font-size: 12px; }
  #sheet {
    position: fixed; right: 12px; bottom: 12px; display: none; image-rendering: pixelated;
    background: repeating-conic-gradient(#3a3a48 0 25%, #2a2a36 0 50%) 0 0 / 16px 16px;
    border: 1px solid rgba(201, 164, 92, 0.7);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><b>LUMINATI</b> · sprite runtime &amp; particles<br /><span class="dim" id="stats">…</span></div>
<canvas id="sheet"></canvas>
<script type="module" src="./sprite_runtime.js"></script>
</body>
</html>
