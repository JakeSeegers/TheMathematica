<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game level loading cases</title>
  <style>
    html, body { margin: 0; background: #0b0a10; color: #e8dcc0; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 20px; color: #c9a45c; letter-spacing: 0.08em; }
    ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    button { background: #1b1724; color: #e8dcc0; border: 1px solid rgba(201, 164, 92, 0.4); border-radius: 4px; padding: 6px 14px; cursor: pointer; font: inherit; }
    button:hover { border-color: #c9a45c; }
    p { color: #a79a80; }
  </style>
</head>
<body>
  <main>
    <h1>Game ← level loading cases</h1>
    <p>Each case builds a level with the LevelFormat helpers, saves it to browser storage and opens it in the game
      (<code>game.html?level=local:&lt;slot&gt;&amp;autostart=1</code>), like the editor's play-test.
      <code>?case=&lt;name&gt;</code> runs one case directly.</p>
    <ul id="cases"></ul>
  </main>
  <script type="module" src="./game_levels.js"></script>
</body>
</html>
