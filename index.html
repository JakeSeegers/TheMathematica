<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Luminati — a 2.5D pixel-art engine for three.js</title>
  <meta name="description" content="Luminati: play its campaigns and levels, or open the level editor. An open-source engine combining pixel-art sprites with lit 3D environments, dynamic shadows and depth of field." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' rx='3' fill='%23140f17'/%3E%3Cpath fill='%23c9a45c' d='M7 2h2v1h1v2h1v2h1v4h-1v1h-1v1H6v-1H5v-1H4V7h1V5h1V3h1z'/%3E%3Cpath fill='%23f59a2e' d='M7 5h2v2h1v3H9v1H7v-1H6V7h1z'/%3E%3Cpath fill='%23fff6d0' d='M7 8h2v2H7z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/launcher/launcher.css" />

<body>
  <!-- The launcher: the list below is written by tools/vite-launcher.js from public/campaigns/ and
       public/levels/ (on every request on the dev server, once in a build). No script. -->
  <main>
    <header class="lu-head">
      <div class="lu-ember" aria-hidden="true"></div>
      <h1>Luminati</h1>
      <div class="lu-rule" aria-hidden="true"></div>
      <p class="lu-tagline">A 2.5D pixel-art engine for three.js</p>
      <p class="lu-intro">Pixel-art sprites in lit 3D dioramas, with dynamic shadows and depth of field.
        Play a campaign or a level, or build your own in the level editor.</p>
      <nav class="lu-jump" aria-label="Sections">
        <a href="#campaigns">Campaigns</a>
        <a href="#levels">Levels</a>
        <a href="#editor">Level editor</a>
      </nav>
    </header>
    <!-- luminati:launcher -->
  </main>
</body>
</html>
