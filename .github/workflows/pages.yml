# Build the game with Vite and publish dist/ to GitHub Pages.
# In the repository settings, set Pages → Build and deployment → Source to "GitHub Actions"
# (with "Deploy from a branch" GitHub runs Jekyll over the raw source instead, which fails on the
# `{{ … }}` in the docs and could not run the game anyway: it needs this build).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/busy-brahmagupta-tkhg1j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
