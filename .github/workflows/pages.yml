# Build the game with Vite and publish dist/ to the `gh-pages` branch.
# In the repository settings, set Pages → Build and deployment → Source to "Deploy from a branch",
# Branch `gh-pages`, folder `/ (root)`. The published files carry a `.nojekyll`, so GitHub serves
# them as they are (pointing Pages at a source branch instead runs Jekyll over the raw files, which
# fails on the `{{ … }}` in the docs and could not run the game anyway: it needs this build).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/busy-brahmagupta-tkhg1j]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
